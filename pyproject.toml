[build-system]
requires = ["setuptools==80.10.2", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "engineering-process-kit"
version = "0.1.0.dev1"
description = "Experimental engineering process exchange reader, validator and MCP adapter"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["jsonschema==4.26.0"]

[project.scripts]
epx = "epx.cli:main"
epx-mcp-call = "epx.adapter:main"

[tool.setuptools]
packages = ["epx", "epx.schemas"]
package-dir = {epx = "src/epx", "epx.schemas" = "schemas"}

[tool.setuptools.package-data]
"epx.schemas" = ["*.json"]
